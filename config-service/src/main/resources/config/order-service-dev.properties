example.property= I AM THE dev
eureka.client.service-url.defaultZone=http://eureka-service:8070/eureka/

spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/orderdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.hbm2ddl=DEBUG

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.type.mapping=orderCreated:com.gcg.orderservice.event.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.type.mapping=stockReservationFailed:com.gcg.orderservice.event.StockReservationFailedEvent,stockReserved:com.gcg.orderservice.event.StockReservedEvent,paymentCompleted:com.gcg.orderservice.event.PaymentCompletedEvent,paymentFailed:com.gcg.orderservice.event.PaymentFailedEvent

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]

spring.kafka.producer.retries=3
spring.kafka.producer.properties.retry.backoff.ms=1000